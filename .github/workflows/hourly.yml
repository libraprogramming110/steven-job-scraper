name: hourly-olj-sweep

# Scheduling is driven by the job-scraper-trigger Cloudflare Worker (reliable
# cron) calling workflow_dispatch — GitHub's built-in schedule event is
# best-effort and drops runs at peak times.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-scraper-sweeps
  cancel-in-progress: false
  queue: max

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Write Telegram config from secrets
        # Via env + JSON.stringify so a stray space, quote or line break in a
        # pasted secret can't break the file; says which secret is empty.
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
            const token = (process.env.TELEGRAM_TOKEN || '').trim();
            const chatId = (process.env.TELEGRAM_CHAT_ID || '').trim().replace(/^\"|\"$/g, '');
            if (!token) console.log('::warning::TELEGRAM_TOKEN secret is empty or missing');
            if (!chatId) console.log('::warning::TELEGRAM_CHAT_ID secret is empty or missing');
            require('fs').writeFileSync('telegram.json', JSON.stringify({ token, chatId }));
          "

      - name: Sweep OnlineJobs.PH (part-time only)
        run: node src/cli.mjs --source onlinejobsph --all

      - name: Commit dedup state back
        run: node scripts/sync-seen.mjs
